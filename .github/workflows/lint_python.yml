name: lint_python
on: [pull_request, push, workflow_dispatch]
jobs:
  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pipx run codespell==2.4.3 --ignore-words-list="commend"
      - run: pipx run ruff==0.16.6 format --check --config "format.quote-style = 'single'"
      - run: pipx run ruff==0.16.6 check --output-format=github --select=ALL --ignore=CPY001,D203,D212,Q000
      - run: pipx run mypy==2.3.1 --ignore-missing-imports --install-types --non-interactive .
      # - run: pipx run pytest==9.1.1 --doctest-modules .
